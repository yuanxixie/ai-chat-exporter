<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Exporter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #fff;
            color: #000;
            min-height: 100vh;
        }

        h1 {
            font-family: "Syncopate", sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 40px;
        }

        .step {
            background: #fff;
            padding: 24px 0;
            margin: 0;
            border-bottom: 1px solid #eee;
        }

        .step:last-of-type {
            border-bottom: none;
        }

        .step-title {
            font-family: "Syncopate", sans-serif;
            font-weight: 400;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 16px;
            color: #999;
        }

        input[type="file"] {
            font-size: 14px;
            color: #999;
        }

        input[type="file"]::file-selector-button {
            background: #fff;
            color: #000;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 0;
            cursor: pointer;
            font-family: "Inter", sans-serif;
            font-size: 14px;
            margin-right: 12px;
            transition: all 0.3s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        input[type="date"] {
            background: #fff;
            color: #000;
            border: 1px solid #ddd;
            padding: 10px 14px;
            border-radius: 0;
            font-size: 14px;
            font-family: "Inter", sans-serif;
            transition: all 0.3s ease;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #000;
        }

        input[type="radio"] {
            accent-color: #000;
        }

        label {
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        label:hover {
            color: #666;
        }

        select {
            background: #fff;
            color: #000;
            border: 1px solid #ddd;
            padding: 10px 14px;
            border-radius: 0;
            font-size: 14px;
            font-family: "Inter", sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        select:focus {
            outline: none;
            border-color: #000;
        }

        select option {
            background: #fff;
            color: #000;
        }

        select option:disabled {
            color: #ccc;
        }

        button {
            font-family: "Syncopate", sans-serif;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: #000;
            color: #fff;
            border: none;
            padding: 16px 48px;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background: #fff;
            color: #000;
            box-shadow: inset 0 0 0 1px #000;
        }

        #status {
            margin-top: 24px;
            padding: 14px 0;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        #status:empty {
            display: none;
        }

        /* Calendar */
        .calendar-container {
            margin-top: 24px;
            display: none;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header button {
            padding: 8px 16px;
            font-size: 10px;
            letter-spacing: 2px;
            background: #fff;
            color: #000;
            border: 1px solid #ddd;
            margin-top: 0;
        }

        .calendar-header button:hover {
            background: #000;
            color: #fff;
            border-color: #000;
            box-shadow: none;
        }

        .calendar-month {
            font-family: "Syncopate", sans-serif;
            font-weight: 400;
            font-size: 12px;
            color: #000;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-weekday {
            text-align: center;
            font-size: 10px;
            color: #bbb;
            padding: 8px 0;
            font-family: "Syncopate", sans-serif;
            letter-spacing: 1px;
        }

        .calendar-day {
            text-align: center;
            padding: 12px 0;
            font-size: 13px;
            color: #ddd;
            transition: all 0.2s ease;
        }

        .calendar-day.has-data {
            background: #f5f5f5;
            color: #000;
            cursor: pointer;
            border: 1px solid #eee;
        }

        .calendar-day.has-data:hover {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .calendar-day.selected {
            background: #000 !important;
            color: #fff !important;
            border-color: #000 !important;
        }

        .calendar-day.today {
            border: 1px solid #000;
        }

        .calendar-stats {
            margin-top: 20px;
            font-size: 11px;
            color: #bbb;
            letter-spacing: 1px;
            font-family: "Syncopate", sans-serif;
            text-transform: uppercase;
        }

        /* Status colors */
        #status.success {
            color: #000;
        }

        #status.error {
            color: #999;
        }

        #status.warning {
            color: #666;
        }
    </style>
</head>
<body>
    <h1>AI Chat Exporter</h1>
    <div class="step">
        <div class="step-title">1. Platform</div>
        <select id="platformSelect" onchange="onPlatformChange()">
            <option value="claude">Claude</option>
            <option value="chatgpt">ChatGPT</option>
            <option value="grok">Grok</option>
            <option value="gemini" disabled>Gemini (not supported)</option>
        </select>
    </div>

    <div class="step">
        <div class="step-title">2. JSON File</div>
        <input type="file" id="fileInput" accept=".json" onchange="onFileSelected()">
    </div>

    <div class="step">
        <div class="step-title">3. Date</div>
        <div style="margin-bottom: 12px;">
            <label>
                <input type="radio" name="dateMode" value="single" checked onchange="toggleDateMode()"> Single
            </label>
            <label style="margin-left: 16px;">
                <input type="radio" name="dateMode" value="range" onchange="toggleDateMode()"> Range
            </label>
            <label style="margin-left: 16px;">
                <input type="radio" name="dateMode" value="all" onchange="toggleDateMode()"> Export All
            </label>
        </div>
        <div id="singleDatePicker">
            <input type="date" id="dateInput">
            <div class="calendar-container" id="calendarContainer">
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)">Prev</button>
                    <span class="calendar-month" id="calendarMonth"></span>
                    <button onclick="changeMonth(1)">Next</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
                <div class="calendar-stats" id="calendarStats"></div>
            </div>
        </div>
        <div id="rangeDatePicker" style="display: none;">
            <input type="date" id="startDate"> to <input type="date" id="endDate">
        </div>
        <div id="allDatesInfo" style="display: none; color: #999; font-size: 14px;">
            One file per date will be generated
        </div>
    </div>

    <div class="step">
        <div class="step-title">4. Content</div>
        <select id="senderSelect">
            <option value="both">Both</option>
            <option value="human">User only</option>
            <option value="assistant">AI only</option>
        </select>
    </div>

    <div class="step">
        <div class="step-title">5. Format</div>
        <select id="formatSelect">
            <option value="markdown">Markdown (.md)</option>
            <option value="plaintext">Plain Text (.txt)</option>
        </select>
    </div>

    <button onclick="exportChat()">Export</button>

    <div id="status"></div>

    <script src="app.js"></script>
</body>
</html>
